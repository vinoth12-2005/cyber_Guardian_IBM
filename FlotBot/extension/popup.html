<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FlotBot AI Security</title>
<style>
  body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
  h2 { font-size: 14px; margin-top: 0; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
  .btn { width: 100%; padding: 8px 12px; margin-bottom: 8px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #1d4ed8; }
  .result { font-size: 11px; background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #334155; margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
  .badge-safe { background: #059669; color: #fff; }
  .badge-warn { background: #d97706; color: #fff; }
  .badge-danger { background: #dc2626; color: #fff; }
</style>
</head>
<body>
  <h2>🛡️ FlotBot AI Companion</h2>
  <button id="btnCheckUrl" class="btn">Inspect Current Page URL</button>
  <div id="output" class="result">Connected to local FlotBot API (127.0.0.1:41738)</div>
  <script src="popup.js"></script>
</body>
</html>
